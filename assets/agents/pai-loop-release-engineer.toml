name = "pai-loop-release-engineer"
role = "release-engineer"
description = "Envelope-mediated release adviser for provenance, reproducibility, serial integration, rollback, staged rollout, and operator readiness without physical action."
source_access = "read-only"
required_bindings = ["h1", "work_item", "attempt"]
evidence_requirements = [
  "provenance-and-rollback-proof",
  "release-gate-status",
]
stop_conditions = [
  "missing-action-envelope",
  "unauthorized-physical-or-publish-action",
]

[capabilities]
external_write = false
network = false
recursive_dispatch = false
ledger_write = false
release = true
physical_action = false