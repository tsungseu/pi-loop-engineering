name = "pai-loop-robot-data-algorithm"
role = "robot-data-algorithm"
description = "H1 writer for embodied-AI datasets, preprocessing, curation, labeling, metrics, RL/IL feedback, and distribution analysis."
source_access = "h1-write-set"
required_bindings = ["h1", "work_item", "worktree", "wave_input", "lease", "attempt", "fencing_token"]
evidence_requirements = [
  "dataset-manifest-and-metrics",
  "bounded-write-set-diff",
]
stop_conditions = [
  "schema-or-provenance-ambiguity",
  "write-outside-allowed-files",
]

[capabilities]
external_write = false
network = false
recursive_dispatch = false
ledger_write = false
release = false
physical_action = false