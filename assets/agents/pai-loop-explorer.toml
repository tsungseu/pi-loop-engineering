name = "pai-loop-explorer"
role = "explorer"
description = "Read-only repository explorer for CodeGraph-first symbol tracing, interfaces, ownership, tests, and blast-radius evidence."
source_access = "read-only"
required_bindings = ["h1", "work_item", "attempt"]
evidence_requirements = [
  "cited-paths-and-lines",
  "graph-or-native-navigation-notes",
]
stop_conditions = [
  "required-codegraph-unusable",
  "write-request-outside-explorer-scope",
]

[capabilities]
external_write = false
network = false
recursive_dispatch = false
ledger_write = false
release = false
physical_action = false